[project]
name = "randoforge"
version = "0.4.0"
description = "Serveur MCP qui donne à Claude des outils fiables pour concevoir des itinéraires de randonnée"
readme = "README.md"
license = "MIT"
keywords = ["mcp", "claude", "randonnee", "hiking", "gpx", "openstreetmap"]
authors = [
    { name = "LaMachiiiine", email = "124789261+Quoifeur2@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "gpxpy>=1.6.2",
    "httpx>=0.28.1",
    "mapbox-vector-tile>=2.2.0",
    "mcp[cli]>=2.3.0",
    "numpy>=2.4.6",
    "pydantic>=2.14.1",
    "pyproj>=3.7.2",
    "rasterio>=1.4.4",
    "shapely>=2.2.0",
    "timezonefinder>=9.0.0",
    "tzdata>=2026.5",
]

[project.scripts]
randoforge = "randoforge.server:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Les tests de bout en bout (réseau, plusieurs minutes) se lancent à part : uv run pytest -m e2e
addopts = "-m 'not e2e'"
markers = ["e2e: tests de bout en bout sur les vrais services (réseau requis)"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# ruff format gère la longueur ; seules les longues chaînes (messages en français) peuvent dépasser.
ignore = ["E501"]
